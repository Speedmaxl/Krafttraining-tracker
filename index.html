*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--b);color:var(--t)}.w{max-width:820px;margin:auto;padding:14px 12px 90px}.p,.card,.modalbox{background:var(--c);border:1px solid var(--l);border-radius:18px;box-shadow:var(--s);padding:14px;margin-bottom:12px}h1{font-size:1.5rem;margin:0 0 4px}.muted{color:var(--m);font-size:.9rem}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}label{display:block;color:var(--m);font-size:.82rem;font-weight:700;margin-bottom:5px}input,textarea,button,select{font:inherit}input,textarea,select{width:100%;border:1px solid var(--l);border-radius:12px;padding:11px;background:#fff}textarea{min-height:68px}.btns{display:flex;flex-wrap:wrap;gap:7px}button{border:0;border-radius:12px;padding:10px 12px;font-weight:800}.pri{background:var(--a);color:#fff}.sec{background:#eef2ff;color:#3730a3}.ghost{background:#f9fafb;border:1px solid var(--l)}.danger{background:#fef2f2;color:var(--d)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.addbtn{text-align:left;background:#f8fafc;border:1px solid var(--l)}.added{opacity:.45}.list{display:grid;gap:10px}.empty{text-align:center;padding:20px;color:var(--m);border:1px dashed #cbd5e1;border-radius:14px}.head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.title{font-weight:900}.exercise-titlebar{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.collapsebtn{flex:0 0 44px;width:44px;height:44px;padding:0;font-size:1.55rem;line-height:1;background:#f8fafc;border:1px solid var(--l);color:var(--a)}.collapsed-card{padding-bottom:14px}.sets{margin-top:10px}.set{display:grid;grid-template-columns:58px 1fr 1fr auto;gap:7px;align-items:end;margin-bottom:7px}.last{background:#f8fafc;border:1px dashed #cbd5e1;border-radius:12px;padding:9px;margin-top:9px;font-size:.88rem}.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.cat{margin-bottom:9px}.cat>button{width:1 .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0}.stat{background:#f8fafc;border:1px solid var(--l);border-radius:12px;padding:10px;text-align:center}.stat b{display:block;font-size:1.25rem}.favtoggle{flex:0 0 44px;width:44px;height:44px;padding:0;font-size:1.35rem;background:#f8fafc;border:1px solid var(--l);color:#9ca3af}.favtoggle.on{background:#fffbeb;border-color:#fcd34d;color:#f59e0b}@media(max-width:600px){.stats{grid-template-columns:repeat(3,1fr)}.stat{padding:8px 4px}.stat span{font-size:.75rem}}
.pickbtn{display:block;width:100%;min-height:72px}.pickbtn>*{pointer-events:none}.pickname{display:block;font-weight:900}.pickmeta,.picklast{display:block;margin-top:3px;font-size:.78rem;font-weight:600;color:var(--m)}.picklast{color:#475569}.picklast b{color:var(--t)}
</style></head><body><div class="w">
<div class="p"><h1>Krafttraining Tracker V4.2.2</h1><div class="muted">Bibliothek · Favoriten · freie Reihenfolge · Kalender · V3-Import</div></div>
<div class="p"><b>Aktuelle Einheit</b><div class="row" style="margin-top:9px"><div><label>Datum</label><input id="date" type="date"></div><div><label>Kommentar</label><input id="note" placeholder="z. B. gut erholt"></div></div><div class="btns" style="margin-top:9px"><button class="pri" id="save">Training speichern</button><button class="sec" id="openlib">+ Übung hinzufügen</button><button class="ghost" id="clear">Einheit leeren</button></div></div>
<div class="p"><b>⭐ Favoriten</b><div id="favs" class="grid" style="margin-top:8px"></div></div>
<div id="workout" class="list"></div>
<div class="p"><div class="calhead"><button class="ghost" id="prev">‹</button><b id="caltitle"></b><button class="ghost" id="next">›</button></div><div id="cal" class="cal"></div><div id="hist"></div></div>
<div class="p"><b>Daten & Bibliothek</b><div class="btns" style="margin-top:8px"><button class="sec" id="manage">Bibliothek verwalten</button><button class="ghost" id="iv3">V3-JSON importieren</button><button class="ghost" id="exp">V4-Backup exportieren</button><button class="ghost" id="imp">V4-Backup importieren</button><input id="f3" type="file" accept="application/json" hidden><input id="f4" type="file" accept="application/json" hidden></div></div>
</div>
<div class="modal" id="libmodal"><div class="modalbox"><div class="head"><b>Übung hinzufügen</b><button class="ghost close" data-close="libmodal">Schließen</button></div><div class="searchbox"><label for="libsearch">Übung suchen</label><input id="libsearch" type="search" placeholder="z. B. Konzentrationscurls" autocomplete="off"></div><div id="libcats"></div></div></div>
<div class="modal" id="manmodal"><div class="modalbox"><div class="head"><b>Bibliothek verwalten</b><button class="ghost close" data-close="manmodal">Schließen</button></div><div id="libstats" class="stats"></div><div class="btns" style="margin:10px 0"><button class="sec" id="newlib">➕ Neue Übung erstellen</button><button class="ghost" id="showarch">Archiv anzeigen</button></div><div id="manlist"></div></div></div>
<div class="modal" id="editmodal"><div class="modalbox"><div class="head"><b id="edittitle">Neue Übung</b><button class="ghost close" data-close="editmodal">Schließen</button></div><div style="margin-top:10px"><label>Name</label><input id="ename" placeholder="z. B. Brustpresse"></div><div style="margin-top:10px"><label>Muskelgruppen (Mehrfachauswahl)</label><div id="egroups" class="grid"></div></div><div class="row" style="margin-top:10px"><div><label>Übungstyp</label><select id="etype"><option value="standard">Standard</option><option value="tri">Bauch: Gerade–Links–Rechts–Gerade</option><option value="time">Zeitübung</option></select></div><div><label>Standardsätze / Runden</label><input id="edefsets" type="number" min="1" max="20" inputmode="numeric" value="3"></div></div><div class="row" style="margin-top:10px"><div><label>Standardgewicht (kg)</label><input id="edefweight" type="number" min="0" step="0.5" inputmode="decimal"></div><div><label>Dauerhafte Notiz</label><input id="enote" placeholder="z. B. J-Hooks Loch 17"></div></div><div class="grid" style="margin-top:10px"><label class="addbtn"><input id="eweight" type="checkbox"> Gewicht (kg)</label><label class="addbtn"><input id="ereps" type="checkbox" checked> Wiederholungen</label><label class="addbtn"><input id="eextraweight" type="checkbox"> Extragewicht pro Satz</label><label class="addbtn"><input id="efav" type="checkbox"> Favorit</label></div><div class="btns" style="margin-top:12px"><button class="pri" id="saveexercise">Übung speichern</button><button class="ghost" id="canceledit">Abbrechen</button></div><div class="muted" style="margin-top:8px">„Satz hinzufügen“ und der Übungskommentar werden automatisch bereitgestellt.</div></div></div>
<script>
const K="krafttraining_tracker_v4", GROUPS=["Rücken","Brust","Schultern","Arme","Beine","Bauch"];
const START=[
{id:"pullups_wide",name:"Klimmzüge breit",cat:["Rücken"],w:false,f:true},{id:"pullups_narrow",name:"Klimmzüge eng",cat:["Rücken"],w:false,f:true},{id:"landmine_wide",name:"Landmine Row breit",cat:["Rücken"],w:true},{id:"landmine_narrow",name:"Landmine Row eng",cat:["Rücken"],w:true},{id:"lat_wide",name:"Latziehen breit",cat:["Rücken"],w:true,f:true},{id:"lat_narrow",name:"Latziehen eng",cat:["Rücken"],w:true},{id:"hyper",name:"Hyperextensions",cat:["Rücken","Bauch"],w:false},{id:"db_row",name:"Rudern KH",cat:["Rücken"],w:true},{id:"deadlift",name:"Kreuzheben LH",cat:["Rücken","Beine"],w:true,f:true},
{id:"hangsit",name:"Hanging Situps",cat:["Bauch"],w:false,s:"tri"},{id:"legraise",name:"Beinheben",cat:["Bauch"],w:false,s:"tri"},{id:"plank",name:"Planks",cat:["Bauch"],w:false,s:"time"},
{id:"squat_free",name:"Kniebeugen frei LH",cat:["Beine"],w:true,f:true},{id:"squat_smith",name:"Kniebeugen Smith",cat:["Beine"],w:true},{id:"legext",name:"Beinstrecker",cat:["Beine"],w:true},{id:"legcurl",name:"Beinbeuger",cat:["Beine"],w:true},{id:"calf",name:"Wadenheben Smith",cat:["Beine"],w:true,f:true},
{id:"bench_b",name:"Bankdrücken LH",cat:["Brust"],w:true,f:true},{id:"bench_d",name:"Bankdrücken KH",cat:["Brust"],w:true},{id:"incl_b",name:"Schrägbankdrücken LH",cat:["Brust"],w:true},{id:"incl_d",name:"Schrägbankdrücken KH",cat:["Brust"],w:true},{id:"dips",name:"Dips",cat:["Brust","Arme"],w:false,f:true},
{id:"latraise",name:"Seitheben KH",cat:["Schultern"],w:true,f:true},{id:"shoulder_smith",name:"Schulterdrücken Smith",cat:["Schultern"],w:true},{id:"frontraise",name:"Frontheben SZ-Stange",cat:["Schultern"],w:true},
{id:"ez_free",name:"SZ-Curls frei",cat:["Arme"],w:true,f:true},{id:"ez_preacher",name:"SZ-Curls Curlpult",cat:["Arme"],w:true},{id:"db_curl",name:"Curls KH",cat:["Arme"],w:true},{id:"cable_curl",name:"Curls Kabelzug",cat:["Arme"],w:true},{id:"forearm",name:"Unterarm Curls LH",cat:["Arme"],w:true},{id:"triceps",name:"Trizepsdrücken Stange",cat:["Arme"],w:true,f:true}];
const MAP={"Hyperextensions – Swissball":"hyper","GravityBoots – Hanging Situps":"hangsit","KH-Seitheben (up-front-side-down)":"latraise","SZ-Curls":"ez_free","Dip-Machine":"dips","Trizeps-Drücken Stange":"triceps","Unterarm-Curls LH":"forearm","Kreuzheben LH":"deadlift","Kniebeugen frei LH":"squat_free","Wadenheben Multipresse":"calf"};
const cp=x=>JSON.parse(JSON.stringify(x)),esc=(x="")=>String(x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"),today=()=>{let d=new Date(),o=d.getTimezoneOffset();return new Date(d-o*60000).toISOString().slice(0,10)};
function normLib(x){return{id:x.id||"custom_"+Date.now()+Math.random(),name:x.name||"Neue Übung",cat:Array.isArray(x.cat)&&x.cat.length?x.cat:["Sonstiges"],w:!!x.w,reps:x.reps!==false,extraWeight:x.extraWeight??["hyper","dips"].includes(x.id),f:!!x.f,note:x.note||"",s:x.s||null,defaultSets:Math.max(1,+x.defaultSets||1),defaultWeight:x.defaultWeight??"",archived:!!x.archived}}
function normSet(e,s={}){if(e.s==="tri")return{straightStart:String(s.straightStart??s.straight??""),left:String(s.left??""),right:String(s.right??""),straightEnd:String(s.straightEnd??"")};if(e.s==="time")return{time:String(s.time??s.reps??"")};return{weight:String(s.weight??""),reps:String(s.reps??""),extraWeight:String(s.extraWeight??"")}}
function normalizeDB(x){x.library=(x.library||cp(START)).map(normLib);x.history=x.history||[];x.draft=x.draft||{date:today(),note:"",ex:[]};[...x.history,{ex:x.draft.ex||[]}].forEach(w=>(w.ex||[]).forEach(e=>{let l=x.library.find(a=>a.id===e.exerciseId);e.s=e.s??l?.s??null;e.w=e.w??l?.w??false;e.reps=e.reps??l?.reps??true;e.extraWeight=e.extraWeight??l?.extraWeight??false;e.collapsed=!!e.collapsed;e.sets=(e.sets||[]).map(s=>normSet(e,s));if(!e.sets.length)e.sets=[normSet(e)]}));return x}
function load(){try{let x=JSON.parse(localStorage.getItem(K));if(x.library&&x.history)return normalizeDB(x)}catch{}return normalizeDB({library:cp(START),history:[],draft:{date:today(),note:"",ex:[]}})}
let db=load(),cursor=new Date(),sel=null,editId=null,showArchived=false,addAfterSave=false;const saveDB=()=>localStorage.setItem(K,JSON.stringify(db)),byid=id=>db.library.find(x=>x.id===id),has=id=>db.draft.ex.some(x=>x.exerciseId===id);
function last(id,before){for(const w of [...db.history].sort((a,b)=>b.date.localeCompare(a.date))){if(before&&w.date>=before)continue;let e=w.ex.find(x=>x.exerciseId===id);if(e)return e}return null}
function lastEntry(id){for(const w of [...db.history].sort((a,b)=>b.date.localeCompare(a.date))){let e=w.ex.find(x=>x.exerciseId===id);if(e)return{w,e}}return null}
function searchKey(x){return[x.name,...x.cat,x.note].join(' ').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase('de')}
function blankSet(lib){if(lib.s==="tri")return{straightStart:"",left:"",right:"",straightEnd:""};if(lib.s==="time")return{time:""};return{weight:lib.w?String(lib.defaultWeight??""):"",reps:"",extraWeight:""}}
function mk(lib){let n=Math.max(1,+lib.defaultSets||1);return{id:"s"+Date.now()+Math.random(),exerciseId:lib.id,name:lib.name,w:lib.w,reps:lib.reps,extraWeight:!!lib.extraWeight,s:lib.s||null,comment:"",collapsed:false,sets:Array.from({length:n},()=>blankSet(lib))}}
function fmt(e){if(e.s==="tri")return e.sets.map((s,i)=>`R${i+1}: G1 ${s.straightStart||"–"} · L ${s.left||"–"} · R ${s.right||"–"} · G2 ${s.straightEnd||"–"}`).join("<br>");if(e.s==="time")return e.sets.map((s,i)=>`R${i+1}: ${s.time||"–"} Sek.`).join("<br>");return e.sets.map((s,i)=>`S${i+1}: ${e.w&&s.weight!==""?s.weight+" kg · ":""}${e.reps!==false?(s.reps||"–")+" Wdh.":""}${e.extraWeight&&s.extraWeight!==""?" · +"+s.extraWeight+" kg extra":""}`).join("<br>")}
function fmtChoice(e){if(e.s==='tri')return e.sets.map(s=>`${s.straightStart||'–'}/${s.left||'–'}/${s.right||'–'}/${s.straightEnd||'–'}`).join(' · ');if(e.s==='time')return e.sets.map(s=>s.time||'–').join(' / ')+' Sek.';return e.sets.map(s=>`${e.w?(s.weight||'–')+' kg · ':''}${e.reps!==false?(s.reps||'–')+' Wdh.':''}${e.extraWeight&&s.extraWeight!==''?' · +'+s.extraWeight+' kg extra':''}`).join(' | ')}
function renderFav(){favs.innerHTML=db.library.filter(x=>x.f&&!x.archived).map(x=>`<button class="addbtn ${has(x.id)?"added":""}" data-add="${x.id}">+ ${esc(x.name)}</button>`).join("")||'<div class="muted">Noch keine Favoriten.</div>'}
function renderWorkout(){if(!db.draft.ex.length){workout.innerHTML='<div class="empty">Noch keine Übung hinzugefügt.</div>';return}workout.innerHTML=db.draft.ex.map((e,i)=>{let l=last(e.exerciseId,db.draft.date),lib=byid(e.exerciseId),collapsed=e.collapsed;return`<div class="card ${collapsed?'collapsed-card':''}"><div class="exercise-titlebar"><div><div class="title">${i+1}. ${esc(e.name)}</div><div class="muted">${esc((lib?.cat||[]).join(" · "))}</div>${lib?.note?`<div class="muted">📝 ${esc(lib.note)}</div>`:""}</div><button class="collapsebtn" data-collapse="${i}">${collapsed?"+":"−"}</button></div>${collapsed?"":`<div class="last"><b>Letzte Einheit:</b><br>${l?fmt(l):"Noch keine Daten."}${l?`<div><button class="ghost" data-copy="${i}">Letzte Einheit kopieren</button></div>`:""}</div><div id="sets${i}" class="sets"></div><div class="btns"><button class="sec" data-addset="${i}">${e.s==="tri"||e.s==="time"?"+ Runde":"+ Satz"}</button><button class="ghost" data-up="${i}">↑</button><button class="ghost" data-down="${i}">↓</button><button class="danger" data-remex="${i}">Entfernen</button></div><div style="margin-top:8px"><label>Kommentar zur Übung</label><input value="${esc(e.comment||"")}" data-comment="${i}" placeholder="z. B. sauber, nächste Einheit +2,5 kg"></div>`}</div>`}).join("");db.draft.ex.forEach((e,i)=>{if(e.collapsed)return;let t=document.getElementById('sets'+i);if(e.s==="tri")t.innerHTML=e.sets.map((s,j)=>`<div class="card" style="box-shadow:none"><b>Runde ${j+1}</b><div class="tri" style="margin-top:7px"><div><label>Gerade 1</label><input type="number" inputmode="numeric" value="${esc(s.straightStart)}" data-field="straightStart" data-e="${i}" data-s="${j}"></div><div><label>Links</label><input type="number" inputmode="numeric" value="${esc(s.left)}" data-field="left" data-e="${i}" data-s="${j}"></div><div><label>Rechts</label><input type="number" inputmode="numeric" value="${esc(s.right)}" data-field="right" data-e="${i}" data-s="${j}"></div><div><label>Gerade 2</label><input type="number" inputmode="numeric" value="${esc(s.straightEnd)}" data-field="straightEnd" data-e="${i}" data-s="${j}"></div></div><button class="danger" data-remset="${i}" data-si="${j}">Runde löschen</button></div>`).join("");else if(e.s==="time")t.innerHTML=e.sets.map((s,j)=>`<div class="set" style="grid-template-columns:70px 1fr auto"><div><b>Runde ${j+1}</b></div><div><label>Sekunden</label><input type="number" inputmode="numeric" value="${esc(s.time)}" data-field="time" data-e="${i}" data-s="${j}"></div><button class="danger" data-remset="${i}" data-si="${j}">×</button></div>`).join("");else t.innerHTML=e.sets.map((s,j)=>`<div class="set" style="grid-template-columns:58px ${e.extraWeight?'1fr 1fr 1fr':'1fr 1fr'} auto"><div><b>Satz ${j+1}</b></div><div><label>kg</label><input type="number" inputmode="decimal" step=".5" ${e.w?'':'disabled'} value="${esc(s.weight)}" data-field="weight" data-e="${i}" data-s="${j}"></div><div><label>Wdh.</label><input type="number" inputmode="numeric" ${e.reps===false?'disabled':''} value="${esc(s.reps)}" data-field="reps" data-e="${i}" data-s="${j}"></div>${e.extraWeight?`<div><label>Extra kg</label><input type="number" inputmode="decimal" min="0" step=".5" value="${esc(s.extraWeight)}" data-field="extraWeight" data-e="${i}" data-s="${j}" placeholder="0"></div>`:''}<button class="danger" data-remset="${i}" data-si="${j}">×</button></div>`).join("")})}
function renderLib(){let raw=(libsearch?.value||'').trim(),q=raw.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase('de'),terms=q.split(/\s+/).filter(Boolean),active=db.library.filter(x=>!x.archived&&terms.every(t=>searchKey(x).includes(t))),btn=x=>{let p=lastEntry(x.id);return`<button class="addbtn pickbtn ${has(x.id)?'added':''}" data-add="${x.id}"><span class="pickname">${x.f?'⭐ ':'+ '}${esc(x.name)}</span><span class="pickmeta">${esc(x.cat.join(' · '))}</span><span class="picklast">${p?`<b>Letzte Einheit ${esc(p.w.date.split('-').reverse().join('.'))}:</b> ${esc(fmtChoice(p.e))}`:'Noch keine Trainingsdaten.'}</span></button>`},html='';if(q){let sorted=[...active].sort((a,b)=>(b.f-a.f)||a.name.localeCompare(b.name,'de'));html+=`<div class="searchmeta muted">${sorted.length?sorted.length+' Treffer · Favoriten zuerst':'Keine passende Übung gefunden.'}</div>`;if(sorted.length)html+=`<div class="grid">${sorted.map(btn).join('')}</div>`;else html+=`<button class="sec" style="width:100%" data-createfromsearch="1">➕ Neue Übung „${esc(raw)}“ erstellen</button>`}else{let fav=active.filter(x=>x.f);if(fav.length)html+=`<div class="sectiontitle">⭐ Favoriten</div><div class="grid">${fav.map(btn).join('')}</div>`;let latest=[...db.history].sort((a,b)=>b.date.localeCompare(a.date))[0],seen=new Set(),recent=(latest?.ex||[]).map(e=>byid(e.exerciseId)).filter(x=>x&&!x.archived&&!seen.has(x.id)&&seen.add(x.id));if(recent.length)html+=`<div class="sectiontitle">🕒 Zuletzt verwendet</div><div class="grid">${recent.map(btn).join('')}</div>`;let cats=[...new Set(active.flatMap(x=>x.cat))];html+=cats.map(c=>`<div class="cat"><button data-cat="${esc(c)}"><span>${esc(c)}</span><span>⌄</span></button><div class="catbody"><div class="grid">${active.filter(x=>x.cat.includes(c)).map(btn).join('')}</div></div></div>`).join('')}libcats.innerHTML=html}
function renderManage(){let active=db.library.filter(x=>!x.archived),archived=db.library.filter(x=>x.archived),favorites=active.filter(x=>x.f);libstats.innerHTML=`<div class="stat"><b>${active.length}</b><span>Aktive Übungen</span></div><div class="stat"><b>${favorites.length}</b><span>Favoriten</span></div><div class="stat"><b>${archived.length}</b><span>Archiviert</span></div>`;let a=showArchived?archived:active;manlist.innerHTML=a.map(x=>`<div class="card" style="box-shadow:none"><div class="head"><div><div class="title">${esc(x.name)}</div><div class="muted">${esc(x.cat.join(' · '))} · ${x.s==='tri'?'Bauch-Runden':x.s==='time'?'Zeit':'Standard'} · ${x.defaultSets} Standardsätze${x.w&&x.defaultWeight!==''?' · '+esc(x.defaultWeight)+' kg':''}</div>${x.note?`<div class="muted">📝 ${esc(x.note)}</div>`:''}</div>${x.archived?'':`<button class="favtoggle ${x.f?'on':''}" data-favorite="${x.id}" aria-label="${x.f?'Aus Favoriten entfernen':'Zu Favoriten hinzufügen'}" title="${x.f?'Aus Favoriten entfernen':'Zu Favoriten hinzufügen'}">${x.f?'★':'☆'}</button>`}</div><div class="btns" style="margin-top:9px"><button class="sec" data-edit="${x.id}">Bearbeiten</button><button class="ghost" data-dup="${x.id}">Duplizieren</button><button class="${x.archived?'sec':'danger'}" data-archive="${x.id}">${x.archived?'Reaktivieren':'Archivieren'}</button></div></div>`).join('')||'<div class="empty">Keine Übungen in dieser Ansicht.</div>';showarch.textContent=showArchived?'Aktive Übungen anzeigen':'Archiv anzeigen'}
function openM(id){document.getElementById(id).classList.add('open')}function closeM(id){document.getElementById(id).classList.remove('open')}
function editExercise(id=null,clone=false,prefill=''){let x=id?byid(id):null;editId=clone?null:id;edittitle.textContent=clone?'Übung duplizieren':x?'Übung bearbeiten':'Neue Übung';ename.value=x?(clone?x.name+' Kopie':x.name):prefill;etype.value=x?.s||'standard';edefsets.value=x?.defaultSets||3;edefweight.value=x?.defaultWeight??'';enote.value=x?.note||'';eweight.checked=x?.w??true;ereps.checked=x?.reps!==false;eextraweight.checked=!!x?.extraWeight;efav.checked=clone?false:(x?.f||false);egroups.innerHTML=GROUPS.map(g=>`<label class="addbtn"><input type="checkbox" data-group="${g}" ${(x?.cat||[]).includes(g)?'checked':''}> ${g}</label>`).join('');openM('editmodal');setTimeout(()=>{ename.focus();if(prefill)ename.setSelectionRange(prefill.length,prefill.length)},50)}
function showToast(msg){toast.textContent=msg;toast.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>toast.classList.remove('show'),2200)}
function saveExercise(){let name=ename.value.trim(),cat=[...egroups.querySelectorAll('[data-group]:checked')].map(x=>x.dataset.group);if(!name){alert('Bitte einen Namen eingeben.');return}if(!cat.length){alert('Bitte mindestens eine Muskelgruppe auswählen.');return}let old=editId?byid(editId):null,x=normLib({id:old?.id||'custom_'+Date.now(),name,cat,w:eweight.checked,reps:ereps.checked,extraWeight:eextraweight.checked,f:efav.checked,note:enote.value.trim(),s:etype.value==='standard'?null:etype.value,defaultSets:+edefsets.value||1,defaultWeight:edefweight.value,archived:false});if(old)Object.assign(old,x);else db.library.push(x);let shouldAdd=addAfterSave&&!old;if(shouldAdd&&!has(x.id))db.draft.ex.push(mk(x));addAfterSave=false;saveDB();closeM('editmodal');render();if(shouldAdd)showToast(`✅ ${name} erstellt und hinzugefügt.`)}
function renderCal(){let y=cursor.getFullYear(),m=cursor.getMonth(),mn=['Jänner','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];caltitle.textContent=`${mn[m]} ${y}`;let h=['Mo','Di','Mi','Do','Fr','Sa','So'].map(x=>`<div class="dow">${x}</div>`).join(''),first=new Date(y,m,1),start=(first.getDay()+6)%7,dim=new Date(y,m+1,0).getDate(),prevd=new Date(y,m,0).getDate();for(let c=0;c<42;c++){let n,mm=m;if(c<start){n=prevd-start+c+1;mm=m-1}else if(c>=start+dim){n=c-start-dim+1;mm=m+1}else n=c-start+1;let d=new Date(y,mm,n),iso=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,hasw=db.history.some(w=>w.date===iso);h+=`<button class="day ${hasw?'has':''}" data-day="${iso}">${n}${hasw?'<span class="dot"></span>':''}</button>`}cal.innerHTML=h;renderHist()}
function renderHist(){if(!sel){hist.innerHTML='';return}let w=db.history.find(x=>x.date===sel);hist.innerHTML=w?`<div class="card" style="box-shadow:none;margin-top:10px"><b>${sel.split('-').reverse().join('.')}</b>${w.note?`<div><i>${esc(w.note)}</i></div>`:''}${w.ex.map(e=>`<div style="margin-top:6px"><b>${esc(e.name)}</b><br>${fmt(e)}</div>`).join('')}</div>`:'<div class="card" style="box-shadow:none;margin-top:10px">Kein Training an diesem Tag.</div>'}
function render(){date.value=db.draft.date;note.value=db.draft.note||'';renderFav();renderWorkout();renderLib();renderManage();renderCal()}
function add(id){if(has(id))return;let l=byid(id);if(l&&!l.archived)db.draft.ex.push(mk(l));saveDB();render()}
function migrate(v){if(!v||!Array.isArray(v.workouts))throw Error();let conv=v.workouts.map(w=>{let ex=[];(w.exercises||[]).forEach(e=>{let id=MAP[e.name]||'import_'+(e.id||Math.random()),lib=byid(id);if(!lib){lib=normLib({id,name:e.name||'Importierte Übung',cat:['Importiert'],w:e.type==='weighted_sets'});db.library.push(lib)}if(e.type==='situps_fixed'){let sets=(e.rounds||[]).map(r=>({straightStart:String(r.gerade??''),left:String(r.links??''),right:String(r.rechts??''),straightEnd:''}));if(sets.length)ex.push({exerciseId:id,name:lib.name,w:false,reps:true,s:'tri',comment:'',sets})}else{let sets=(e.sets||[]).map(s=>({weight:String(s.weight??''),reps:String(s.reps??''),extraWeight:''}));if(sets.length)ex.push({exerciseId:id,name:lib.name,w:lib.w,reps:true,extraWeight:!!lib.extraWeight,s:null,comment:'',sets})}});return{date:w.date,note:w.note||'',ex}});let map=new Map(db.history.map(w=>[w.date,w]));conv.forEach(w=>map.set(w.date,w));db.history=[...map.values()].sort((a,b)=>b.date.localeCompare(a.date));saveDB();return conv.length}
document.addEventListener('input',e=>{if(e.target===note){db.draft.note=e.target.value;saveDB();return}if(e.target===date){db.draft.date=e.target.value;saveDB();return}let t=e.target.dataset;if(t.field){db.draft.ex[+t.e].sets[+t.s][t.field]=e.target.value;saveDB()}else if(t.comment!==undefined){db.draft.ex[+t.comment].comment=e.target.value;saveDB()}})
document.addEventListener('click',e=>{let id=e.target.dataset.favorite;if(!id)return;let x=byid(id);if(x&&!x.archived){x.f=!x.f;saveDB();render();showToast(x.f?`⭐ ${x.name} als Favorit gespeichert.`:`${x.name} aus Favoriten entfernt.`)}})
document.addEventListener('click',e=>{let t=e.target.dataset;if(t.add){add(t.add);return}if(t.collapse!==undefined){db.draft.ex[+t.collapse].collapsed=!db.draft.ex[+t.collapse].collapsed;saveDB();renderWorkout();return}if(t.up!==undefined){let i=+t.up;if(i>0)[db.draft.ex[i-1],db.draft.ex[i]]=[db.draft.ex[i],db.draft.ex[i-1]];saveDB();renderWorkout();return}if(t.down!==undefined){let i=+t.down;if(i<db.draft.ex.length-1)[db.draft.ex[i+1],db.draft.ex[i]]=[db.draft.ex[i],db.draft.ex[i+1]];saveDB();renderWorkout();return}if(t.remex!==undefined){db.draft.ex.splice(+t.remex,1);saveDB();render();return}if(t.addset!==undefined){let x=db.draft.ex[+t.addset],l=byid(x.exerciseId)||x;x.sets.push(blankSet(l));saveDB();renderWorkout();return}if(t.remset!==undefined){let x=db.draft.ex[+t.remset],j=+t.si;if(x.sets.length===1)x.sets[0]=blankSet(byid(x.exerciseId)||x);else x.sets.splice(j,1);saveDB();renderWorkout();return}if(t.copy!==undefined){let x=db.draft.ex[+t.copy],l=last(x.exerciseId,db.draft.date);if(l){x.sets=cp(l.sets);x.comment=l.comment||'';saveDB();renderWorkout()}return}if(t.createfromsearch!==undefined){let name=libsearch.value.trim();addAfterSave=true;closeM('libmodal');editExercise(null,false,name);return}if(t.cat!==undefined){e.target.closest('.cat').classList.toggle('open');return}if(t.close){closeM(t.close);return}if(t.edit){editExercise(t.edit);return}if(t.dup){editExercise(t.dup,true);return}if(t.archive){let x=byid(t.archive);x.archived=!x.archived;x.f=x.archived?false:x.f;saveDB();render();return}if(t.day){sel=t.day;renderCal()}})
openlib.onclick=()=>{libsearch.value='';renderLib();openM('libmodal');setTimeout(()=>libsearch.focus(),50)};libsearch.oninput=renderLib;manage.onclick=()=>{showArchived=false;renderManage();openM('manmodal')};newlib.onclick=()=>{addAfterSave=false;editExercise()};showarch.onclick=()=>{showArchived=!showArchived;renderManage()};saveexercise.onclick=saveExercise;canceledit.onclick=()=>{addAfterSave=false;closeM('editmodal')};
save.onclick=()=>{if(!db.draft.ex.length){alert('Bitte zuerst mindestens eine Übung hinzufügen.');return}let w={date:date.value,note:note.value.trim(),ex:cp(db.draft.ex)};db.history=db.history.filter(x=>x.date!==w.date);db.history.push(w);db.history.sort((a,b)=>b.date.localeCompare(a.date));db.draft={date:today(),note:'',ex:[]};saveDB();sel=w.date;render();alert('Training gespeichert.')};clear.onclick=()=>{if(confirm('Einheit wirklich leeren?')){db.draft={date:today(),note:'',ex:[]};saveDB();render()}};prev.onclick=()=>{cursor=new Date(cursor.getFullYear(),cursor.getMonth()-1,1);renderCal()};next.onclick=()=>{cursor=new Date(cursor.getFullYear(),cursor.getMonth()+1,1);renderCal()};
iv3.onclick=()=>f3.click();f3.onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=x=>{try{let n=migrate(JSON.parse(x.target.result));render();alert(`${n} V3-Einheiten importiert.`)}catch{alert('V3-Import fehlgeschlagen.')}};r.readAsText(f);e.target.value=''};exp.onclick=()=>{let b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=`krafttraining-v4-${today()}.json`;a.click();URL.revokeObjectURL(u)};imp.onclick=()=>f4.click();f4.onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=x=>{try{let q=JSON.parse(x.target.result);if(!q.library||!q.history)throw Error();db=normalizeDB(q);saveDB();render();alert('Backup importiert.')}catch{alert('Import fehlgeschlagen.')}};r.readAsText(f);e.target.value=''};
